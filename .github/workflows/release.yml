name: Create Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:

  build:
    name: Build ${{ matrix.os }}
    strategy:
      matrix:
        os:
          - windows-latest
          - ubuntu-latest
          - macos-latest

    runs-on: ${{ matrix.os }}

    steps:

      - name: Checkout
        uses: actions/checkout@v4


      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"


      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller


      - name: Download FFmpeg
        run: |
          python scripts/download_ffmpeg.py


      - name: Build application
        run: |
          python build.py


      - name: Package
        shell: bash
        run: |

          mkdir release

          if [[ "${{ runner.os }}" == "Windows" ]]; then
            7z a release/BKVideoEncoder-${{ github.ref_name }}-Windows.7z dist/*
          fi

          if [[ "${{ runner.os }}" == "Linux" ]]; then
            tar -czf release/BKVideoEncoder-${{ github.ref_name }}-Linux.tar.gz dist/*
          fi

          if [[ "${{ runner.os }}" == "macOS" ]]; then
            tar -czf release/BKVideoEncoder-${{ github.ref_name }}-macOS.tar.gz dist/*
          fi


      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ runner.os }}
          path: release/


  release:

    needs: build

    runs-on: ubuntu-latest


    steps:

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: release


      - name: Generate checksums
        run: |
          cd release
          find . -type f -exec sha256sum {} \; > SHA256SUMS.txt


      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2

        with:

          generate_release_notes: true

          files: |
            release/**/*.7z
            release/**/*.tar.gz
            release/**/SHA256SUMS.txt
