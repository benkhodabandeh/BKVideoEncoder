[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "bk-video-encoder"
version = "2026.7.7"
description = "A professional video encoding toolbox powered by FFmpeg"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "GPL-3.0-only"}
authors = [{name = "Benyamin Khodabandeh"}]
keywords = ["ffmpeg", "video-encoder", "x264", "x265", "customtkinter"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Win32 (MS Windows)",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Multimedia :: Video :: Conversion",
]

[project.urls]
Homepage = "https://github.com/benkhodabandeh/BKVideoEncoder"
Repository = "https://github.com/benkhodabandeh/BKVideoEncoder"
